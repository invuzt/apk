plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.example.androidautobuildapk'
    compileSdk 35

    defaultConfig {
        applicationId "com.example.androidautobuildapk"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0"

        ndk {
            // Hanya gunakan arm64-v8a untuk hasil paling kecil (opsional)
            // Jika untuk moto g45, arm64-v8a saja sudah cukup
            abiFilters "arm64-v8a"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            // Menggunakan optimasi agresif R8
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug
        }
    }

    packagingOptions {
        jniLibs {
            // Memastikan library native tidak dikompres ganda
            useLegacyPackaging = false
        }
        resources {
            // Membuang file meta-data yang tidak perlu
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
            excludes += '/META-INF/kotlin-stdlib.kotlin_module'
        }
    }
}

dependencies {
    // Menghapus core-ktx untuk menghemat ruang
    // Menggunakan library dasar bawaan Android SDK
}
