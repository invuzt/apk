plugins { id 'com.android.application' }

android {
    // Definisi package dipindah ke sini
    namespace 'a.b'
    compileSdk 35

    defaultConfig {
        applicationId "a.b"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0"
        ndk { abiFilters "arm64-v8a" }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            signingConfig signingConfigs.debug
        }
    }
}
