name: Build Split APK (Smallest Size)

on:
  push:
    branches: [ rust, main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi

      - name: Install Tools
        run: |
          cargo install cargo-ndk || true
          sudo apt-get update && sudo apt-get install -y upx-ucl

      - name: Build & Compress Rust Libraries
        run: |
          cd app/src/main/rust
          # Build ARM64
          cargo ndk -t arm64-v8a -o ../jniLibs/ build --release
          # Build ARMv7
          cargo ndk -t armeabi-v7a -o ../jniLibs/ build --release
          
          # Kompres semua .so yang dihasilkan
          find ../jniLibs/ -name "*.so" -exec upx --best --ultra-brute {} \;

      - name: Build Split APKs
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: vuzt-split-v${{ github.run_number }}
          files: app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
