name: Build Final Ultra-Slim APK

on:
  push:
    branches: [ rust, main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Install Rust & Tools
        run: |
          rustup target add aarch64-linux-android
          cargo install cargo-ndk || true
          sudo apt-get update && sudo apt-get install -y upx-ucl

      - name: Build & Compress Rust
        run: |
          cd app/src/main/rust
          cargo ndk -t arm64-v8a -o ../jniLibs/ build --release
          upx --best --ultra-brute ../jniLibs/arm64-v8a/libvuzt_native.so || true

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Release Only Optimized APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: vuzt-final-v${{ github.run_number }}
          files: app/build/outputs/apk/release/*-arm64-v8a-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
