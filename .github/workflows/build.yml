name: Build Rust-Java APK Ultra-Slim

on:
  push:
    branches: [ rust, main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install Tools (Cargo-NDK & UPX)
        run: |
          cargo install cargo-ndk || true
          sudo apt-get update && sudo apt-get install -y upx-ucl

      - name: Build & Compress Rust Library
        run: |
          cd app/src/main/rust
          # Build hanya untuk arm64 agar APK tidak dobel ukuran
          cargo ndk -t arm64-v8a -o ../jniLibs/ build --release
          
          # EKSEKUSI PEMERASAN: Kompres .so dengan UPX level maksimal
          upx --best --ultra-brute ../jniLibs/arm64-v8a/libvuzt_native.so || true

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: vuzt-v${{ github.run_number }}
          name: Vuzt Ultra Slim v${{ github.run_number }}
          files: app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
